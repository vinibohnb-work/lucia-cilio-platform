<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<!-- Domínio próprio (22/10): o evento vive em lcoffice.pt/momentos (o token pessoal fica guardado por domínio).
     Está aqui e não só no vercel.json porque a cache da Vercel serve a página antes das regras por domínio. -->
<script>if (/^(lucia-cilio-platform\.vercel\.app|app\.lcoffice\.pt|www\.lcoffice\.pt)$/.test(location.hostname)) location.replace('https://lcoffice.pt' + location.pathname + location.search + location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Participantes · LC Office Consulting</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E3D33">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Área de participantes do evento (migração 048, api/evento.js).
   Só para quem está no evento: não é uma página do site. Visual de app, simples,
   com o verde e o dourado da LC Office. Uma coluna no telemóvel. */
:root {
  --cream: #F3E9D6; --cream-2: #FBF6EC; --cream-3: #EAD8B7; --papel: #FFFDF8;
  --green: #0E3D33; --green-2: #184F43; --green-3: #0A2E27; --gold: #B9892F; --gold-2: #C89B3C; --gold-3: #E2C27E; --gold-text: #8A5B12;
  --ink: #1E2E29; --muted: #5C6A64; --line: rgba(14,61,51,.12); --line-ouro: rgba(185,137,47,.3); --err: #8E2F20; --ok: #184F43;
  --display: 'Archivo Black', 'Arial Black', system-ui, sans-serif;
  --body: 'Archivo', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--cream); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; padding-bottom: 48px }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
a { color: inherit }
button, input, textarea { font: inherit }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px }

/* Banda verde do topo (com os círculos dourados da landing) */
.banda { position: relative; overflow: hidden; color: var(--cream);
  background: radial-gradient(90% 80% at 88% -10%, rgba(200,155,60,.30), transparent 60%), linear-gradient(165deg, var(--green) 0%, var(--green-3) 100%);
  padding-top: max(18px, env(safe-area-inset-top, 0px)); padding-bottom: 76px }
.banda::before, .banda::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(200,155,60,.38); pointer-events: none }
.banda::before { width: 460px; height: 460px; right: -170px; top: -230px }
.banda::after { width: 300px; height: 300px; left: -150px; bottom: -190px; border-color: rgba(200,155,60,.2) }
.banda > .wrap { position: relative; z-index: 1 }
.marca { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px }
.marca img { height: 38px; width: auto; display: block }
.selo { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-3); border: 1px solid rgba(226,194,126,.45); border-radius: 999px; padding: 6px 12px }

.hero { text-align: center; padding-top: 26px }
.hero .ev { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-3) }
.hero .ev::before, .hero .ev::after { content: ''; width: 22px; height: 1px; background: var(--gold-2) }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6.4vw, 48px); line-height: 1.08; color: var(--cream); margin: 12px 0 8px; text-wrap: balance }
.hero h1 em { font-style: normal; color: var(--gold-2) }
.hero p { margin: 0 auto; max-width: 50ch; color: rgba(243,233,214,.78) }

.tabs { display: flex; gap: 4px; max-width: 420px; margin: 26px auto 0; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(200,155,60,.4) }
.tabs button { flex: 1; background: none; border: 0; border-radius: 999px; padding: 10px 8px; min-height: 46px; font-weight: 700; font-size: 15px; color: rgba(243,233,214,.82); cursor: pointer; transition: background .25s, color .25s }
.tabs button[aria-selected="true"] { background: var(--gold-2); color: var(--green-3); box-shadow: 0 8px 18px -10px rgba(0,0,0,.5) }

/* Conteúdo: sobe por cima da banda */
.conteudo { position: relative; margin-top: -48px }

.aviso { background: var(--green); color: var(--cream); border-radius: 18px; padding: 16px 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; box-shadow: 0 22px 40px -28px rgba(10,46,39,.7); border: 1px solid rgba(200,155,60,.4) }
.aviso p { margin: 0; flex: 1; min-width: 220px; font-size: 14.5px }
.aviso strong { color: var(--gold-3) }

.pesquisa { position: relative; margin-bottom: 14px }
.pesquisa input { width: 100%; padding: 14px 16px 14px 46px; border-radius: 16px; border: 1px solid var(--line-ouro); background: var(--papel); color: var(--ink); min-height: 52px; box-shadow: 0 22px 40px -30px rgba(10,46,39,.55) }
.pesquisa svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gold) }
.contagem { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-text); margin: 18px 0 12px }

.grelha { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px }
.pessoa { background: var(--papel); border: 1px solid var(--line-ouro); border-radius: 20px; padding: 18px; display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: center; box-shadow: 0 18px 34px -28px rgba(10,46,39,.5); min-width: 0; position: relative; overflow: hidden }
.pessoa::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--green), var(--gold-2)) }
.foto { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; background: var(--green); display: block; box-shadow: 0 0 0 3px var(--papel), 0 0 0 4.5px var(--gold-2) }
.foto.vazia { display: flex; align-items: center; justify-content: center; color: var(--gold-3) }
.pessoa.eu { border-color: var(--gold-2) }
.tu { display: inline-block; vertical-align: middle; margin-left: 6px; padding: 2px 9px; border-radius: 999px; background: var(--gold-2); color: var(--green-3); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase }
.pessoa h3 { margin: 0; font-size: 18px; line-height: 1.25; color: var(--green) }
.pessoa .neg { margin: 3px 0 0; color: var(--gold-text); font-size: 13.5px; font-weight: 600 }
.pessoa .loc { margin: 4px 0 0; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 4px }
.pessoa .sobre { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; padding-top: 12px; border-top: 1px solid var(--line) }
.ligacoes { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; font-weight: 700; font-size: 14px; text-decoration: none; cursor: pointer }
.btn-ouro { background: var(--gold-2); color: var(--green-3) }
.btn-verde { background: var(--green); color: var(--cream) }
.btn-linha { background: transparent; color: var(--green); border: 1.5px solid var(--green) }
.btn-clara { background: transparent; color: var(--cream); border: 1.5px solid rgba(226,194,126,.6) }
.btn-perigo { background: transparent; color: var(--err); border: 1.5px solid var(--err) }
.btn[disabled] { opacity: .55; cursor: default }
.vazio { text-align: center; color: var(--muted); padding: 34px 16px; background: var(--papel); border: 1px dashed var(--line-ouro); border-radius: 20px }

/* Formulário do perfil num cartão */
form.perfil { max-width: 640px; margin-inline: auto; display: grid; gap: 16px; background: var(--papel); border: 1px solid var(--line-ouro); border-radius: 24px; padding: clamp(18px, 4vw, 30px); box-shadow: 0 26px 50px -36px rgba(10,46,39,.6); color: var(--ink) }
.foto-edit { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; padding-bottom: 6px }
.foto-edit .foto { width: 112px; height: 112px }
.titulo-sec { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-text); display: flex; align-items: center; gap: 10px; margin-top: 4px }
.titulo-sec::after { content: ''; flex: 1; height: 1px; background: var(--line-ouro) }
label.campo { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--green) }
label.campo small { font-weight: 400; color: var(--muted) }
label.campo input, label.campo textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--cream-2); color: var(--ink); min-height: 48px; font-weight: 400; transition: border-color .2s, background .2s }
label.campo input:focus, label.campo textarea:focus { border-color: var(--gold-2); background: #fff; outline: none; box-shadow: 0 0 0 3px rgba(200,155,60,.22) }
label.campo textarea { min-height: 110px; resize: vertical }
.duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
@media (max-width: 560px) { .duplo { grid-template-columns: 1fr } .pessoa { grid-template-columns: 72px 1fr } .pessoa .foto { width: 72px; height: 72px } }
.partilha { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; background: var(--green); color: var(--cream); border-radius: 16px; padding: 16px; cursor: pointer }
.partilha input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--gold-2) }
.partilha small { display: block; color: rgba(243,233,214,.75); margin-top: 2px; font-size: 13px }
.acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.estado { font-size: 14px; font-weight: 600 }
.estado.ok { color: var(--ok) } .estado.erro { color: var(--err) }
.privacidade { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; margin: 6px 0 0 }
.privacidade p { margin: 0 0 10px }
.confirmar { background: #FFF7F3; border: 1px solid #E8C9BF; border-radius: 14px; padding: 14px; display: grid; gap: 10px }
.confirmar p { margin: 0; font-size: 14px }

/* Ecrãs de entrada e de aviso: o ecrã todo em verde */
.ecra { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; margin-bottom: -48px; padding-bottom: 32px }
.ecra > .wrap { width: 100% }
.ecra .centro { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; max-width: 560px; width: 100%; padding-block: 28px }
.ecra .hero { padding-top: 0 }
.ecra form.perfil { text-align: left; margin-top: 26px; width: 100% }
.acoes-ecra { margin-top: 26px }
.fotos { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-decoration: none; background: var(--gold-2); color: var(--green-3); border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 22px 40px -28px rgba(10,46,39,.7) }
.fotos strong { display: block; font-size: 16px }
.fotos small { display: block; font-size: 13px; opacity: .85; margin-top: 2px }
.fotos-ic { width: 44px; height: 44px; border-radius: 50%; background: rgba(10,46,39,.12); display: flex; align-items: center; justify-content: center }
.fotos-seta { font-size: 20px; font-weight: 700 }
.lista-aval { max-width: 680px; margin-inline: auto; display: grid; gap: 14px }
.aval { background: var(--papel); border: 1px solid var(--line-ouro); border-radius: 20px; padding: 18px; box-shadow: 0 18px 34px -28px rgba(10,46,39,.5); position: relative; overflow: hidden }
.aval::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--green), var(--gold-2)) }
.aval-cab h3 { margin: 4px 0 0; font-size: 18px; line-height: 1.25; color: var(--green) }
.aval-cab p { margin: 2px 0 0; color: var(--gold-text); font-size: 14px; font-weight: 600 }
.aval-hora { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted) }
.perg { margin: 12px 0 10px; font-size: 14px; color: var(--ink) }
.escala { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px }
.escala button { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--cream-2); color: var(--green); font-weight: 700; font-size: 15px; cursor: pointer; padding: 0; font-variant-numeric: tabular-nums }
.escala button[aria-pressed="true"] { background: var(--gold-2); border-color: var(--gold-2); color: var(--green-3); box-shadow: 0 8px 16px -10px rgba(10,46,39,.6) }
.extremos { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px }
.coment { margin-top: 12px }
.coment textarea { min-height: 64px }
.aval .estado { margin-top: 8px; min-height: 1em }
.aval-evento { background: var(--green); border-color: rgba(200,155,60,.45) }
.aval-evento .aval-cab h3, .aval-evento .perg { color: var(--cream) }
.aval-evento .aval-cab p { color: var(--gold-3) }
.aval-evento .extremos { color: rgba(243,233,214,.7) }
.aval-evento .escala button { background: rgba(255,255,255,.08); border-color: rgba(200,155,60,.35); color: var(--cream) }
.aval-evento .escala button[aria-pressed="true"] { background: var(--gold-2); color: var(--green-3) }
.aval-evento label.campo { color: var(--cream) }
.aval-evento label.campo small { color: rgba(243,233,214,.7) }
.aval-evento .estado.ok { color: var(--gold-3) }
.aval-evento .estado.erro { color: #F2B8A8 }
@media (max-width: 560px) { .escala { grid-template-columns: repeat(6, 1fr) } }
.so-leitores { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
@media (prefers-reduced-motion: no-preference) {
  .pessoa { transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s }
  .pessoa:hover { transform: translateY(-3px); box-shadow: 0 26px 44px -28px rgba(10,46,39,.6) }
  .conteudo, .ecra .centro { animation: sobe .6s cubic-bezier(.2,.8,.2,1) both }
  @keyframes sobe { from { opacity: 0; transform: translateY(14px) } }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cadeado" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-lupa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-local" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10v7M8 7v.01M12 17v-4a2.5 2.5 0 0 1 5 0v4M12 10v7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-site" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-pessoa" viewBox="0 0 24 24"><circle cx="12" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-camara" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<main id="app" aria-live="polite">
  <section class="banda ecra"><div class="wrap centro"><p>A carregar…</p></div></section>
</main>

<script>
// Área de participantes — fala só com /api/evento.
// Pedido da Lúcia (20/10), em vez de crachás: no dia, o QR code do evento abre
// esta página com o código (#c=…); a pessoa escreve o nome e recebe um token
// pessoal, que fica guardado neste telemóvel. O código e o token saem da barra
// de endereço logo a seguir, para não irem parar a capturas de ecrã.
(function () {
  const CHAVE = 'momentos-participante'
  const app = document.getElementById('app')
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const ler = () => { try { return localStorage.getItem(CHAVE) } catch { return null } }
  const guardar = (t) => { try { if (t) localStorage.setItem(CHAVE, t); else localStorage.removeItem(CHAVE) } catch { /* sem armazenamento */ } }

  // Um link novo colado nesta mesma aba só muda o "#": recarrega para o ler
  window.addEventListener('hashchange', () => { if (/[#&][tc]=/.test(location.hash)) location.reload() })
  const m = /(?:^|[#&])t=([A-Za-z0-9_-]{24,64})/.exec(location.hash)
  const mc = /(?:^|[#&])c=([A-Za-z0-9_-]{8,40})/.exec(location.hash)
  if (m) guardar(m[1])
  if (m || mc) history.replaceState(null, '', location.pathname)
  let token = (m && m[1]) || ler()
  const codigo = mc && mc[1]

  // ev: o evento (nome, data, local, landing) — vem da API, a página serve qualquer evento (migração 050)
  let dados = null, aba = 'participantes', filtro = '', ev = null
  const conhecer = (e) => { if (e && e.nome) { ev = e; document.title = 'Participantes · ' + e.nome } }
  const dataLonga = (d) => new Date(d + 'T12:00:00').toLocaleDateString('pt-PT', { day: 'numeric', month: 'long' })

  async function api(metodo, corpo) {
    const r = metodo === 'GET'
      ? await fetch('/api/evento?t=' + encodeURIComponent(token), { cache: 'no-store' })
      : await fetch('/api/evento', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, ...corpo }) })
    const j = await r.json().catch(() => ({}))
    if (!r.ok) { conhecer(j.evento); throw Object.assign(new Error(j.error || 'Algo correu mal. Tente de novo.'), { estado: r.status, dados: j }) }
    return j
  }

  // Antes de entrar: o código do QR diz que evento é e se a área já abriu
  async function eventoDoQR() {
    const r = await fetch('/api/evento?c=' + encodeURIComponent(codigo), { cache: 'no-store' })
    const j = await r.json().catch(() => ({}))
    conhecer(j.evento)
    return { estado: r.status, j }
  }
  function fechado(estado, j) {
    if (estado === 403) semAcesso('Ainda não abriu', j.abre ? `A área de participantes abre a ${dataLonga(j.abre)}.` : 'A área de participantes abre no dia do evento.')
    else if (estado === 410) semAcesso('A área fechou', j.error || 'A área de participantes deste evento já fechou.')
    else semAcesso('QR code inválido', j.error || 'Peça o QR code atual à organização do evento.')
  }

  const marca = `<div class="marca"><img src="/logo-letra-branca.png" alt="LC Office Consulting" height="32"><span class="selo"><svg width="12" height="12"><use href="#i-cadeado"/></svg>Participantes</span></div>`

  function semAcesso(titulo, texto) {
    app.innerHTML = `<section class="banda ecra"><div class="wrap">${marca}</div><div class="wrap centro">
        <div class="hero"><div class="ev">${esc(ev ? ev.nome : 'LC Office Consulting')}</div><h1>${esc(titulo)}</h1><p>${esc(texto)}</p></div>
        ${ev && ev.landing ? `<div class="acoes-ecra"><a class="btn btn-clara" href="${esc(ev.landing)}">Ver a página do evento</a></div>` : ''}</div></section>`
  }

  const fotoHtml = (url, nome, cls = '') => url
    ? `<img class="foto ${cls}" src="${esc(url)}" alt="${esc(nome)}" loading="lazy" referrerpolicy="no-referrer">`
    : `<span class="foto vazia ${cls}" role="img" aria-label="Sem fotografia"><svg width="46" height="46"><use href="#i-pessoa"/></svg></span>`

  function cartao(p) {
    const lig = []
    if (p.instagram) lig.push(`<a class="btn btn-verde" href="https://instagram.com/${encodeURIComponent(p.instagram)}" target="_blank" rel="noopener noreferrer"><svg width="18" height="18"><use href="#i-ig"/></svg>Instagram</a>`)
    if (p.linkedin) lig.push(`<a class="btn btn-linha" href="${esc(p.linkedin)}" target="_blank" rel="noopener noreferrer"><svg width="18" height="18"><use href="#i-in"/></svg>LinkedIn</a>`)
    if (p.site) lig.push(`<a class="btn btn-linha" href="${esc(p.site)}" target="_blank" rel="noopener noreferrer"><svg width="18" height="18"><use href="#i-site"/></svg>Site</a>`)
    return `<article class="pessoa${p.tu ? ' eu' : ''}">
      ${fotoHtml(p.foto, p.nome)}
      <div style="min-width:0">
        <h3>${esc(p.nome)}${p.tu ? ' <span class="tu">Tu</span>' : ''}</h3>
        ${p.cargo || p.negocio ? `<p class="neg">${esc([p.cargo, p.negocio].filter(Boolean).join(' · '))}</p>` : ''}
        ${p.localidade ? `<p class="loc"><svg width="14" height="14"><use href="#i-local"/></svg>${esc(p.localidade)}</p>` : ''}
      </div>
      ${p.sobre ? `<p class="sobre">${esc(p.sobre)}</p>` : ''}
      ${lig.length ? `<div class="ligacoes">${lig.join('')}</div>` : ''}
    </article>`
  }

  // Avaliação das apresentações de negócio (migração 051; a tabela chama-se evento_palestras):
  // NPS de 0 a 10, comentário opcional, grava ao tocar
  const avaliacaoDe = (id) => (dados.avaliacoes || []).find(a => a.palestra === id)
  function blocoAvaliar(item, pergunta) {
    const a = avaliacaoDe(item.id)
    const nota = a ? a.nota : null
    return `<article class="aval${item.id ? '' : ' aval-evento'}" data-p="${esc(item.id || '')}">
      <div class="aval-cab">${item.hora ? `<span class="aval-hora">${esc(item.hora)}</span>` : ''}<h3>${esc(item.titulo)}</h3>${item.orador ? `<p>${esc(item.orador)}</p>` : ''}</div>
      <p class="perg">${pergunta}</p>
      <div class="escala" role="group" aria-label="Nota de 0 a 10">${Array.from({ length: 11 }, (_, n) => `<button type="button" data-n="${n}" aria-pressed="${nota === n}">${n}</button>`).join('')}</div>
      <div class="extremos" aria-hidden="true"><span>Nada provável</span><span>Muito provável</span></div>
      <div class="coment"${nota === null ? ' hidden' : ''}><label class="campo">Comentário <small>Opcional. O que gostaste ou o que mudavas.</small><textarea maxlength="500" rows="2">${esc(a ? a.comentario : '')}</textarea></label></div>
      <div class="estado" role="status"></div>
    </article>`
  }
  async function guardarAvaliacao(el, palestra, nota) {
    const ta = el.querySelector('textarea'), est = el.querySelector('.estado')
    est.className = 'estado'; est.textContent = 'A guardar…'
    try {
      await api('POST', { acao: 'avaliar', palestra, nota, comentario: ta.value })
      dados.avaliacoes = (dados.avaliacoes || []).filter(a => a.palestra !== palestra).concat({ palestra, nota, comentario: ta.value })
      el.querySelectorAll('.escala button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.n) === nota)))
      el.querySelector('.coment').hidden = false
      est.className = 'estado ok'; est.textContent = 'Obrigado! Avaliação guardada.'
    } catch (e) { est.className = 'estado erro'; est.textContent = e.message }
  }
  function ligarAvaliar() {
    app.querySelectorAll('.aval').forEach(el => {
      const palestra = el.dataset.p || null
      el.querySelectorAll('.escala button').forEach(b => b.addEventListener('click', () => guardarAvaliacao(el, palestra, Number(b.dataset.n))))
      const ta = el.querySelector('textarea')
      ta.addEventListener('blur', () => {
        const a = avaliacaoDe(palestra)
        if (a && ta.value !== a.comentario) guardarAvaliacao(el, palestra, a.nota)
      })
    })
  }

  function render() {
    const eu = dados.eu
    // O próprio perfil também aparece (primeiro, com "Tu"), para cada um ver como os outros o veem
    const todos = eu.partilhar ? [{ ...eu, tu: true }, ...dados.participantes] : dados.participantes
    const lista = todos.filter(p => !filtro || [p.nome, p.negocio, p.cargo, p.localidade].join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(filtro))
    const nomeEvento = dados.evento.nome
    const cab = `<section class="banda"><div class="wrap">${marca}
      <div class="hero">
        <div class="ev">${esc(nomeEvento)}</div>
        <h1>${{ perfil: 'O meu <em>perfil</em>', avaliar: 'Avaliar os <em>negócios</em>' }[aba] || 'Conhece quem <em>está aqui</em>'}</h1>
        <p>${{ perfil: 'Apresenta-te aos outros participantes. Só aparece quem escolhe partilhar.', avaliar: 'Uma pergunta por cada negócio apresentado. Leva menos de um minuto.' }[aba] || 'Uma comunidade de negócios: partilha, ligações e novas oportunidades.'}</p>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-participantes" aria-selected="${aba === 'participantes'}">Participantes</button>
        <button role="tab" id="tab-perfil" aria-selected="${aba === 'perfil'}">O meu perfil</button>
        <button role="tab" id="tab-avaliar" aria-selected="${aba === 'avaliar'}">Avaliar</button>
      </div></div></section>`

    if (aba === 'participantes') {
      const convite = !eu.partilhar ? `<div class="aviso"><p><strong>Ainda não apareces aqui.</strong> Preenche o teu perfil e escolhe partilhá-lo para os outros te conhecerem.</p><button class="btn btn-ouro" id="ir-perfil">Preencher o meu perfil</button></div>` : ''
      const fotos = dados.fotos ? `<a class="fotos" href="${esc(dados.fotos)}" target="_blank" rel="noopener noreferrer"><span class="fotos-ic"><svg width="22" height="22"><use href="#i-camara"/></svg></span><span><strong>Fotografias do evento</strong><small>Vê e descarrega as fotografias. Só para quem participou: não partilhes o link.</small></span><span class="fotos-seta" aria-hidden="true">↗</span></a>` : ''
      app.innerHTML = cab + `<div class="wrap conteudo">` + fotos + convite + `
        <div class="pesquisa"><svg width="18" height="18"><use href="#i-lupa"/></svg>
          <label class="so-leitores" for="pesquisa">Pesquisar</label>
          <input id="pesquisa" type="search" placeholder="Pesquisar nome, empresa, cargo ou localidade" value="${esc(filtro)}" autocomplete="off"></div>
        <p class="contagem">${todos.length === 1 ? '1 participante partilhou o perfil' : todos.length + ' participantes partilharam o perfil'}${filtro ? ` · ${lista.length} encontrado(s)` : ''}</p>
        ${lista.length ? `<div class="grelha">${lista.map(cartao).join('')}</div>` : `<div class="vazio">${todos.length ? 'Ninguém corresponde à pesquisa.' : 'Ainda ninguém partilhou o perfil. Sê o primeiro!'}</div>`}</div>`
      const inp = document.getElementById('pesquisa')
      inp.addEventListener('input', () => { filtro = inp.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); const pos = inp.selectionStart; render(); const n = document.getElementById('pesquisa'); n.focus(); n.setSelectionRange(pos, pos) })
      document.getElementById('ir-perfil')?.addEventListener('click', () => { aba = 'perfil'; render() })
    } else if (aba === 'avaliar') {
      const palestras = dados.palestras || []
      app.innerHTML = cab + `<div class="wrap conteudo"><div class="lista-aval">
        ${palestras.length ? palestras.map(p => blocoAvaliar(p, 'De 0 a 10, quanto recomendarias este negócio a um amigo ou colega?')).join('') : '<div class="vazio">Ainda não há apresentações de negócio para avaliar.</div>'}
        ${blocoAvaliar({ id: null, titulo: 'O evento', orador: nomeEvento }, `De 0 a 10, quanto recomendarias o ${esc(nomeEvento)} a outro empreendedor?`)}
        <p class="privacidade">As avaliações ajudam a organização a preparar os próximos eventos. Os resultados são vistos sem nomes.</p>
      </div></div>`
      ligarAvaliar()
    } else {
      app.innerHTML = cab + `<div class="wrap conteudo">
        <form class="perfil" id="form-perfil" novalidate>
          <div class="foto-edit">
            <span id="foto-atual">${fotoHtml(eu.foto, eu.nome)}</span>
            <div>
              <label class="btn btn-linha" for="foto-ficheiro" style="cursor:pointer"><svg width="18" height="18"><use href="#i-camara"/></svg>${eu.foto ? 'Mudar fotografia' : 'Pôr fotografia'}</label>
              <input id="foto-ficheiro" type="file" accept="image/jpeg,image/png,image/webp" class="so-leitores">
              <div class="estado" id="foto-estado" style="margin-top:6px"></div>
            </div>
          </div>
          <div class="titulo-sec">Quem sou</div>
          <label class="campo" for="f-nome">Nome<input id="f-nome" name="nome" maxlength="80" required value="${esc(eu.nome)}" autocomplete="name"></label>
          <label class="campo" for="f-empresa">Empresa<input id="f-empresa" name="negocio" maxlength="80" value="${esc(eu.negocio)}" placeholder="Ex.: LC Office Consulting" autocomplete="organization"></label>
          <label class="campo" for="f-cargo">Cargo<input id="f-cargo" name="cargo" maxlength="80" value="${esc(eu.cargo)}" placeholder="Ex.: Fundadora" autocomplete="organization-title"></label>
          <label class="campo" for="f-localidade">Localidade<input id="f-localidade" name="localidade" maxlength="60" value="${esc(eu.localidade)}" placeholder="Ex.: Lisboa" autocomplete="address-level2"></label>
          <label class="campo" for="f-sobre">Sobre o meu negócio <small>Até 400 caracteres. O que fazes e com quem gostavas de te ligar.</small><textarea id="f-sobre" name="sobre" maxlength="400">${esc(eu.sobre)}</textarea></label>
          <div class="titulo-sec">Onde me encontrar</div>
          <div class="duplo">
            <label class="campo" for="f-instagram">Instagram<input id="f-instagram" name="instagram" maxlength="60" value="${esc(eu.instagram)}" placeholder="@o.teu.perfil" autocapitalize="off"></label>
            <label class="campo" for="f-linkedin">LinkedIn<input id="f-linkedin" name="linkedin" maxlength="200" value="${esc(eu.linkedin)}" placeholder="linkedin.com/in/…" autocapitalize="off" inputmode="url"></label>
          </div>
          <label class="campo" for="f-site">Site <small>Opcional.</small><input id="f-site" name="site" maxlength="200" value="${esc(eu.site)}" placeholder="www.o-teu-negocio.pt" autocapitalize="off" inputmode="url"></label>
          <label class="partilha" for="f-partilhar">
            <input id="f-partilhar" name="partilhar" type="checkbox" ${eu.partilhar ? 'checked' : ''}>
            <span><strong>Partilhar o meu perfil com os participantes</strong><small>O perfil fica visível apenas para quem está no evento e entrou pelo QR code. Podes deixar de partilhar a qualquer momento.</small></span>
          </label>
          <div class="acoes">
            <button class="btn btn-ouro" type="submit" id="guardar">Guardar perfil</button>
            <span class="estado" id="estado" role="status"></span>
          </div>
          <div class="privacidade">
            <p>Responsável pelos dados: LC Office Consulting. Usamos o que escreveres aqui só para os participantes deste evento se conhecerem; nada é vendido nem usado para publicidade. A área está aberta apenas no dia do evento e os perfis são apagados depois.</p>
            <div id="zona-apagar"><button class="btn btn-perigo" type="button" id="apagar">Apagar o meu perfil</button></div>
            <p style="margin-top:10px"><button class="btn btn-linha" type="button" id="sair">Sair neste dispositivo</button></p>
          </div>
        </form></div>`

      const form = document.getElementById('form-perfil')
      const estado = document.getElementById('estado')
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault()
        const f = new FormData(form)
        const perfil = { nome: f.get('nome'), negocio: f.get('negocio'), cargo: f.get('cargo'), localidade: f.get('localidade'), sobre: f.get('sobre'), instagram: f.get('instagram'), linkedin: f.get('linkedin'), site: f.get('site'), partilhar: document.getElementById('f-partilhar').checked }
        if (!String(perfil.nome).trim()) { estado.className = 'estado erro'; estado.textContent = 'Escreve o teu nome.'; return }
        const btn = document.getElementById('guardar'); btn.disabled = true; estado.className = 'estado'; estado.textContent = 'A guardar…'
        try {
          await api('POST', { acao: 'perfil', perfil })
          await carregar(false)
          aba = 'perfil'; render()
          const e2 = document.getElementById('estado'); e2.className = 'estado ok'; e2.textContent = perfil.partilhar ? 'Guardado. Já apareces na lista de participantes.' : 'Guardado. O perfil não está a ser partilhado.'
        } catch (e) { estado.className = 'estado erro'; estado.textContent = e.message; btn.disabled = false }
      })

      document.getElementById('foto-ficheiro').addEventListener('change', async (ev) => {
        const ficheiro = ev.target.files && ev.target.files[0]
        const fe = document.getElementById('foto-estado')
        if (!ficheiro) return
        if (!/^image\/(jpeg|png|webp)$/.test(ficheiro.type)) { fe.className = 'estado erro'; fe.textContent = 'Usa uma imagem JPEG, PNG ou WebP.'; return }
        fe.className = 'estado'; fe.textContent = 'A enviar…'
        try {
          const imagem = await reduzir(ficheiro, 640)
          const r = await api('POST', { acao: 'foto', imagem })
          dados.eu.foto = r.foto
          document.getElementById('foto-atual').innerHTML = fotoHtml(r.foto, dados.eu.nome)
          fe.className = 'estado ok'; fe.textContent = 'Fotografia guardada.'
        } catch (e) { fe.className = 'estado erro'; fe.textContent = e.message }
      })

      document.getElementById('apagar').addEventListener('click', () => {
        const z = document.getElementById('zona-apagar')
        z.innerHTML = `<div class="confirmar"><p>Apagar a fotografia e tudo o que escreveste? Deixas de aparecer aos outros participantes. O teu link continua a funcionar.</p><div class="acoes"><button class="btn btn-perigo" type="button" id="apagar-sim">Sim, apagar</button><button class="btn btn-linha" type="button" id="apagar-nao">Cancelar</button></div></div>`
        document.getElementById('apagar-nao').addEventListener('click', render)
        document.getElementById('apagar-sim').addEventListener('click', async () => {
          try { await api('POST', { acao: 'apagar' }); await carregar(false); aba = 'perfil'; render(); const e2 = document.getElementById('estado'); e2.className = 'estado ok'; e2.textContent = 'Perfil apagado.' }
          catch (e) { z.innerHTML = `<p class="estado erro">${esc(e.message)}</p>` }
        })
      })
      document.getElementById('sair').addEventListener('click', () => { guardar(null); semAcesso('Saíste neste dispositivo', 'Para voltar, lê de novo o QR code do evento. Vais entrar com um perfil novo.') })
    }
    document.getElementById('tab-participantes').addEventListener('click', () => { aba = 'participantes'; render() })
    document.getElementById('tab-perfil').addEventListener('click', () => { aba = 'perfil'; render() })
    document.getElementById('tab-avaliar').addEventListener('click', () => { aba = 'avaliar'; render() })
  }

  // Reduz a fotografia no próprio telemóvel (lado maior 640 px, JPEG) antes de enviar
  function reduzir(ficheiro, max) {
    return new Promise((ok, falha) => {
      const img = new Image()
      const url = URL.createObjectURL(ficheiro)
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height))
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k)
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
        URL.revokeObjectURL(url)
        ok(c.toDataURL('image/jpeg', 0.85))
      }
      img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('Não foi possível ler a imagem.')) }
      img.src = url
    })
  }

  async function carregar(mostrar = true) {
    try {
      dados = await api('GET')
      conhecer(dados.evento)
      if (mostrar) { aba = dados.eu.partilhar ? 'participantes' : 'perfil'; render() }
    } catch (e) {
      if (e.estado === 401) { guardar(null); token = null; semAcesso('Acesso inválido', 'Volta a ler o QR code do evento para entrares.') }
      else if (e.estado === 403 || e.estado === 410) fechado(e.estado, e.dados || {})
      else semAcesso('Não foi possível abrir', e.message)
      throw e
    }
  }

  // Entrar pela primeira vez: só o nome; o resto do perfil vem a seguir
  function entrada() {
    app.innerHTML = `<section class="banda ecra"><div class="wrap">${marca}</div><div class="wrap centro">
        <div class="hero"><div class="ev">${esc(ev ? ev.nome : 'Área de participantes')}</div><h1>Bem-<em>vindo</em></h1>
        <p>Em vez de crachás, um perfil no telemóvel. Escreve o teu nome para entrares; o resto preenches a seguir.</p></div>
        <form id="form-entrar" class="perfil" novalidate>
          <label class="campo" for="e-nome">O teu nome<input id="e-nome" maxlength="80" required autocomplete="name"></label>
          <div class="acoes"><button class="btn btn-ouro" type="submit" id="entrar">Entrar</button><span class="estado" id="estado-entrar" role="status"></span></div>
          <p class="privacidade">Só aparece aos outros quem escolher partilhar o perfil. A área está aberta apenas no dia do evento.</p>
        </form></div></section>`
    const f = document.getElementById('form-entrar')
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault()
      const nome = document.getElementById('e-nome').value.trim()
      const est = document.getElementById('estado-entrar')
      if (!nome) { est.className = 'estado erro'; est.textContent = 'Escreve o teu nome.'; return }
      const btn = document.getElementById('entrar'); btn.disabled = true; est.className = 'estado'; est.textContent = 'A entrar…'
      try {
        const r = await fetch('/api/evento', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao: 'entrar', codigo, nome }) })
        const j = await r.json().catch(() => ({}))
        if (!r.ok) throw new Error(j.error || 'Não foi possível entrar.')
        token = j.t; guardar(token)
        await carregar()
      } catch (e) { est.className = 'estado erro'; est.textContent = e.message; btn.disabled = false }
    })
  }

  // Com QR: se o telemóvel já tem acesso a este evento, entra direto; se é de outro evento
  // (ou o acesso já não vale), pede o nome para este. Sem QR: usa o acesso guardado.
  async function arrancar() {
    if (!codigo) {
      if (token) return carregar().catch(() => {})
      return semAcesso('Área reservada a participantes', 'No dia do evento, lê o QR code à entrada para entrares.')
    }
    const { estado, j } = await eventoDoQR()
    if (estado !== 200) return fechado(estado, j)
    const doQR = j.evento
    if (token) {
      try { dados = await api('GET') } catch { dados = null }
      if (dados && dados.evento.id === doQR.id) { conhecer(dados.evento); aba = dados.eu.partilhar ? 'participantes' : 'perfil'; return render() }
      conhecer(doQR)
    }
    entrada()
  }
  arrancar().catch(() => semAcesso('Não foi possível abrir', 'Verifica a ligação à internet e tenta de novo.'))
})()
</script>
</body>
</html>
