<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d3b20" />
    <title>Sem ligação · LC Office Consulting</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #0d3b20; color: #f3efe4;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .cartao { max-width: 380px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; font-weight: 800; margin: 20px 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #cdd9cf; margin: 0 0 6px; }
      .outras { font-size: 12.5px; color: #93a896; margin-top: 14px; }
      button {
        margin-top: 22px; min-height: 44px; padding: 0 22px;
        background: transparent; color: #d8bd74;
        border: 1px solid rgba(201, 168, 76, .45); border-radius: 10px;
        font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="cartao">
      <img src="/icons/icon-192.png" alt="LC Office Consulting" />
      <h1>Sem ligação à internet</h1>
      <p>A plataforma precisa de rede para ir buscar os seus dados. Assim que voltar a ter ligação, é só recarregar.</p>
      <p class="outras">
        Keine Internetverbindung — bitte neu laden, sobald Sie wieder online sind.<br />
        No internet connection — reload once you are back online.
      </p>
      <button onclick="location.reload()">Tentar de novo · Erneut · Retry</button>
    </div>
  </body>
</html>
