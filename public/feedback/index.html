<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<!-- Como a área de participantes: vive em lcoffice.pt. Está aqui e não só no vercel.json
     porque a cache da Vercel serve a página antes das regras por domínio. -->
<script>if (/^(lucia-cilio-platform\.vercel\.app|app\.lcoffice\.pt|www\.lcoffice\.pt)$/.test(location.hostname)) location.replace('https://lcoffice.pt' + location.pathname + location.search + location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A tua opinião · LC Office Consulting</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E3D33">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Formulário de feedback dos eventos (pedido da Letícia, 13/11; migração 062, api/evento.js).
   O mesmo para todos os eventos: lcoffice.pt/feedback/#e=<id do evento>. Acabamento da
   landing e da área de participantes: creme, verde profundo, dourado em traços finos,
   títulos em Archivo Black. Uma coluna no telemóvel. Anónimo: sem nome nem e-mail. */
:root {
  --cream: #F3E9D6; --cream-2: #FBF6EC; --cream-3: #EAD8B7; --papel: #FFFDF8;
  --green: #0E3D33; --green-2: #184F43; --green-3: #0A2E27; --gold: #B9892F; --gold-2: #C89B3C; --gold-3: #E2C27E; --gold-text: #8A5B12;
  --ink: #1E2E29; --muted: #5C6A64; --line: rgba(14,61,51,.12); --line-ouro: rgba(185,137,47,.3); --err: #8E2F20;
  --display: 'Archivo Black', 'Arial Black', system-ui, sans-serif;
  --body: 'Archivo', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--cream); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; padding-bottom: 48px }
.wrap { max-width: 760px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
a { color: inherit }
button, input, textarea { font: inherit }
:focus-visible { outline: 3px solid var(--gold-2); outline-offset: 3px }
.so-leitores { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* Banda verde do topo, com os arcos dourados da landing */
.banda { position: relative; overflow: hidden; color: var(--cream);
  background: radial-gradient(90% 80% at 88% -10%, rgba(200,155,60,.30), transparent 60%), linear-gradient(165deg, var(--green) 0%, var(--green-3) 100%);
  padding-top: max(18px, env(safe-area-inset-top, 0px)); padding-bottom: 84px }
.banda::before, .banda::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(200,155,60,.38); pointer-events: none }
.banda::before { width: 460px; height: 460px; right: -170px; top: -230px }
.banda::after { width: 300px; height: 300px; left: -150px; bottom: -190px; border-color: rgba(200,155,60,.2) }
.banda > .wrap { position: relative; z-index: 1 }
.marca { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px }
.marca img { height: 38px; width: auto; display: block }
.selo { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-3); border: 1px solid rgba(226,194,126,.45); border-radius: 999px; padding: 6px 12px }

.hero { text-align: center; padding-top: 30px }
.hero .ev { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-3) }
.hero .ev::before, .hero .ev::after { content: ''; width: 22px; height: 1px; background: var(--gold-2) }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 7vw, 54px); line-height: 1.05; color: var(--cream); margin: 14px 0 12px; text-wrap: balance }
.hero h1 em { font-style: normal; color: var(--gold-2) }
.hero p { margin: 0 auto; max-width: 52ch; color: rgba(243,233,214,.8) }
.hero p strong { color: var(--cream) }

/* O formulário sobe por cima da banda */
.conteudo { position: relative; margin-top: -56px }
form.opiniao { display: grid; gap: 14px }
.perg { position: relative; overflow: hidden; margin: 0; background: var(--papel); border: 1px solid var(--line-ouro); border-radius: 20px; padding: 18px 18px 16px; box-shadow: 0 18px 34px -28px rgba(10,46,39,.5); min-width: 0; transition: border-color .25s, box-shadow .25s }
.perg::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--green), var(--gold-2)) }
.perg legend { float: left; width: 100%; padding: 0; margin: 0 0 14px; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; font-size: 16.5px; font-weight: 700; line-height: 1.35; color: var(--green) }
.perg legend + * { clear: both }
.num { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--green); color: var(--gold-3); font-family: var(--display); font-size: 15px; line-height: 1 }
.perg.respondida .num { background: var(--gold-2); color: var(--green-3) }
.perg.falta { border-color: var(--err); box-shadow: 0 0 0 3px rgba(142,47,32,.12) }
.sn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-left: 46px }
@media (max-width: 480px) { .sn { padding-left: 0 } }
.sn label { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--cream-2); color: var(--green); font-weight: 700; font-size: 16px; cursor: pointer; user-select: none; transition: background .2s, border-color .2s, color .2s, transform .15s }
.sn label:hover { border-color: var(--gold-2) }
.sn input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer }
.sn label:has(input:focus-visible) { outline: 3px solid var(--gold-2); outline-offset: 3px }
.sn .ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: .35 }
.sn label:has(input:checked) { border-color: transparent; box-shadow: 0 10px 20px -12px rgba(10,46,39,.7) }
.sn label.sim:has(input:checked) { background: var(--green); color: var(--cream) }
.sn label.nao:has(input:checked) { background: var(--gold-2); color: var(--green-3) }
.sn label:has(input:checked) .ico { opacity: 1 }
.sn label:active { transform: scale(.98) }

.melhorar { background: var(--green); border-color: rgba(200,155,60,.45) }
.melhorar legend { color: var(--cream) }
.melhorar .num { background: var(--gold-2); color: var(--green-3) }
.melhorar .ajuda { margin: -6px 0 12px 46px; color: rgba(243,233,214,.75); font-size: 14px }
@media (max-width: 480px) { .melhorar .ajuda { margin-left: 0 } }
.melhorar textarea { width: 100%; min-height: 130px; resize: vertical; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(200,155,60,.4); background: rgba(255,255,255,.07); color: var(--cream); line-height: 1.5 }
.melhorar textarea::placeholder { color: rgba(243,233,214,.5) }
.melhorar textarea:focus { outline: none; border-color: var(--gold-2); background: rgba(255,255,255,.11); box-shadow: 0 0 0 3px rgba(200,155,60,.25) }
.contador { text-align: right; font-size: 12px; color: rgba(243,233,214,.6); margin-top: 6px; font-variant-numeric: tabular-nums }

.armadilha { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden }

.enviar { display: grid; gap: 12px; justify-items: center; text-align: center; padding-top: 8px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 30px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 700; font-size: 16px; text-decoration: none; cursor: pointer; transition: transform .2s, background .2s }
.btn:hover { transform: translateY(-1px) }
.btn-ouro { background: linear-gradient(180deg, #D8AE52, var(--gold-2)); color: var(--green-3); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 14px 28px -14px rgba(185,137,47,.9) }
.btn-clara { background: transparent; color: var(--cream); border-color: rgba(226,194,126,.6) }
.btn[disabled] { opacity: .6; cursor: default; transform: none }
.progresso { font-size: 13px; font-weight: 600; color: var(--muted) }
.progresso b { color: var(--green) }
.erro { color: var(--err); font-weight: 700; font-size: 14px; min-height: 1em; margin: 0 }
.nota { font-size: 13px; color: var(--muted); margin: 4px 0 0; display: inline-flex; align-items: center; gap: 6px }
.lema { margin-top: 30px; text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--green) }
.lema span { color: var(--gold-2); margin: 0 .2em }
@media (max-width: 480px) { .lema { letter-spacing: .14em; line-height: 2 } }

/* Ecrãs inteiros (obrigado, fechado, a carregar) */
.ecra { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; margin-bottom: -48px; padding-bottom: 32px }
.ecra > .wrap { width: 100% }
.ecra .centro { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding-block: 28px }
.ecra .hero { padding-top: 0 }
.ecra .assina { margin-top: 22px; color: var(--gold-3); font-weight: 700; font-size: 17px }
.ecra .assina small { display: block; margin-top: 6px; color: rgba(243,233,214,.72); font-weight: 400; font-style: italic; font-size: 15px }
.ecra .lema { color: var(--cream) }
.acoes-ecra { margin-top: 28px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap }
.selo-ok { width: 74px; height: 74px; margin: 0 auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--gold-2); color: var(--green-3); box-shadow: 0 0 0 8px rgba(200,155,60,.18) }
.selo-ok svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round }

@media (prefers-reduced-motion: no-preference) {
  .conteudo, .ecra .centro { animation: sobe .6s cubic-bezier(.2,.8,.2,1) both }
  @keyframes sobe { from { opacity: 0; transform: translateY(14px) } }
  .selo-ok { animation: aparece .7s cubic-bezier(.2,1.4,.4,1) .15s both }
  @keyframes aparece { from { opacity: 0; transform: scale(.6) } }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-cadeado" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<main id="app" aria-live="polite">
  <section class="banda ecra"><div class="wrap centro"><p>A carregar…</p></div></section>
</main>

<script>
// Formulário de feedback — fala só com /api/evento. O link traz o evento: #e=<id>.
(function () {
  const app = document.getElementById('app')
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const me = /(?:^|[#&])e=([a-z0-9-]{2,80})/.exec(location.hash)
  const id = me && me[1]
  const CHAVE = 'feedback-enviado-' + id
  const enviado = () => { try { return !!localStorage.getItem(CHAVE) } catch { return false } }
  const marcar = () => { try { localStorage.setItem(CHAVE, '1') } catch { /* sem armazenamento */ } }
  window.addEventListener('hashchange', () => location.reload())

  // As mesmas perguntas da Gestão (src/data/feedbackEvento.js) e da API (PERGUNTAS_FEEDBACK)
  const PERGUNTAS = [
    ['gostou', 'Gostaste de participar no evento?'],
    ['temas', 'Consideras que os temas abordados foram relevantes para o teu percurso como empreendedor(a)?'],
    ['palestras', 'As palestras corresponderam às tuas expectativas?'],
    ['networking', 'Consideras que o evento proporcionou boas oportunidades de networking e criação de contactos?'],
    ['voltaria', 'Participarias numa próxima edição do {evento}?'],
    ['recomendaria', 'Recomendarias este evento a outros empreendedores?'],
  ]
  const MAX = 1000
  let ev = null
  const abertoEm = Date.now()

  const marca = `<div class="marca"><img src="/logo-letra-branca.png" alt="LC Office Consulting" height="32"><span class="selo">A tua opinião</span></div>`
  const lema = `<div class="lema">Conhecer <span>•</span> Partilhar <span>•</span> Conectar <span>•</span> Crescer</div>`
  const voltar = () => ev && ev.landing ? `<a class="btn btn-clara" href="${esc(ev.landing)}">Ver a página do evento</a>` : ''

  function ecra(titulo, texto) {
    app.innerHTML = `<section class="banda ecra"><div class="wrap">${marca}</div><div class="wrap centro">
      <div class="hero"><div class="ev">${esc(ev ? ev.nome : 'LC Office Consulting')}</div><h1>${titulo}</h1><p>${esc(texto)}</p></div>
      <div class="acoes-ecra">${voltar()}</div></div></section>`
  }

  function obrigado(jaTinha) {
    document.title = 'Obrigado · ' + (ev ? ev.nome : 'LC Office Consulting')
    app.innerHTML = `<section class="banda ecra"><div class="wrap">${marca}</div><div class="wrap centro">
      <div class="selo-ok" aria-hidden="true"><svg><use href="#i-check"/></svg></div>
      <div class="hero" style="padding-top:18px"><div class="ev">${esc(ev ? ev.nome : 'LC Office Consulting')}</div>
        <h1>Obrigado por fazeres parte <em>desta iniciativa!</em></h1>
        <p>${jaTinha ? 'A tua opinião já chegou até nós.' : 'Recebemos a tua opinião.'} Ajuda-nos a tornar os próximos encontros ainda melhores.</p></div>
      <div class="assina">LC Office Consulting<small>Continuamos a criar espaços para conectar pessoas, ideias e oportunidades.</small></div>
      ${lema}
      <div class="acoes-ecra">${voltar()}</div></div></section>`
    window.scrollTo(0, 0)
  }

  function formulario() {
    document.title = 'A tua opinião · ' + ev.nome
    const perguntas = PERGUNTAS.map(([k, texto], i) => `
      <fieldset class="perg" id="p-${k}">
        <legend><span class="num" aria-hidden="true">${i + 1}</span><span>${esc(texto.replace('{evento}', ev.nome))}</span></legend>
        <div class="sn">
          <label class="sim"><input type="radio" name="${k}" value="sim"><svg class="ico" aria-hidden="true"><use href="#i-check"/></svg>Sim</label>
          <label class="nao"><input type="radio" name="${k}" value="nao"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg>Não</label>
        </div>
      </fieldset>`).join('')
    app.innerHTML = `
      <section class="banda"><div class="wrap">${marca}
        <div class="hero"><div class="ev">${esc(ev.nome)}</div>
          <h1>A tua opinião é <em>importante!</em></h1>
          <p><strong>Obrigado por fazeres parte do ${esc(ev.nome)}.</strong> Queremos saber como foi a tua experiência. A tua opinião ajuda-nos a tornar os próximos encontros ainda melhores.</p>
        </div></div></section>
      <div class="wrap conteudo">
        <form class="opiniao" novalidate>
          ${perguntas}
          <fieldset class="perg melhorar">
            <legend><span class="num" aria-hidden="true">7</span><span>O que poderíamos melhorar?</span></legend>
            <p class="ajuda" id="ajuda-melhorar">Deixa-nos uma sugestão, ideia ou comentário. Queremos ouvir-te!</p>
            <textarea name="comentario" maxlength="${MAX}" aria-describedby="ajuda-melhorar" placeholder="Escreve aqui (opcional)"></textarea>
            <div class="contador" aria-hidden="true"><span id="conta">0</span> / ${MAX}</div>
          </fieldset>
          <div class="armadilha" aria-hidden="true"><label>Não preencher <input name="site_web" tabindex="-1" autocomplete="off"></label></div>
          <div class="enviar">
            <div class="progresso" id="progresso"><b>0</b> de ${PERGUNTAS.length} respondidas</div>
            <p class="erro" id="erro" role="alert"></p>
            <button class="btn btn-ouro" type="submit">Enviar a minha opinião</button>
            <p class="nota"><svg width="13" height="13" aria-hidden="true"><use href="#i-cadeado"/></svg>Anónimo: não pedimos o teu nome nem o teu e-mail.</p>
          </div>
        </form>
        ${lema}
      </div>`

    const form = app.querySelector('form')
    const erro = document.getElementById('erro')
    const prog = document.getElementById('progresso')
    const respondidas = () => PERGUNTAS.filter(([k]) => form.querySelector(`input[name="${k}"]:checked`))
    form.addEventListener('change', (e) => {
      const fs = e.target.closest('fieldset.perg')
      if (fs && e.target.type === 'radio') { fs.classList.add('respondida'); fs.classList.remove('falta') }
      prog.innerHTML = `<b>${respondidas().length}</b> de ${PERGUNTAS.length} respondidas`
      if (respondidas().length === PERGUNTAS.length) erro.textContent = ''
    })
    form.comentario.addEventListener('input', () => { document.getElementById('conta').textContent = form.comentario.value.length })

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const faltam = PERGUNTAS.filter(([k]) => !form.querySelector(`input[name="${k}"]:checked`))
      if (faltam.length) {
        faltam.forEach(([k]) => document.getElementById('p-' + k).classList.add('falta'))
        erro.textContent = faltam.length === 1 ? 'Falta responder a uma pergunta.' : `Faltam responder a ${faltam.length} perguntas.`
        const primeira = document.getElementById('p-' + faltam[0][0])
        primeira.scrollIntoView({ behavior: 'smooth', block: 'center' })
        primeira.querySelector('input').focus({ preventScroll: true })
        return
      }
      const respostas = Object.fromEntries(PERGUNTAS.map(([k]) => [k, form.querySelector(`input[name="${k}"]:checked`).value === 'sim']))
      const botao = form.querySelector('button[type=submit]')
      botao.disabled = true; botao.textContent = 'A enviar…'; erro.textContent = ''
      try {
        const r = await fetch('/api/evento', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'feedback', evento: id, respostas, comentario: form.comentario.value, site_web: form.site_web.value, aberto: abertoEm }) })
        const j = await r.json().catch(() => ({}))
        if (!r.ok) throw new Error(j.error || 'Não foi possível enviar. Tente de novo.')
        marcar(); obrigado(false)
      } catch (err) {
        erro.textContent = err.message || 'Sem ligação. Tente de novo.'
        botao.disabled = false; botao.textContent = 'Enviar a minha opinião'
      }
    })
  }

  async function iniciar() {
    if (!id) return ecra('Formulário não encontrado', 'Este link não está completo. Peça o link do formulário à organização do evento.')
    try {
      const r = await fetch('/api/evento?feedback=' + encodeURIComponent(id), { cache: 'no-store' })
      const j = await r.json().catch(() => ({}))
      if (j.evento) ev = j.evento
      if (r.status === 410) return ecra('O formulário <em>fechou</em>', 'Obrigado pelo interesse. Já não estamos a receber respostas para este evento.')
      if (!r.ok) return ecra('Formulário não encontrado', j.error || 'Peça o link do formulário à organização do evento.')
      if (enviado()) return obrigado(true)
      formulario()
    } catch {
      ecra('Sem ligação', 'Verifique a ligação à internet e tente de novo.')
    }
  }
  iniciar()
})()
</script>
</body>
</html>
