<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lúcia Cílio — Revisão de Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     Tokens copiados de src/theme.js — se mudarem lá, mudam aqui.
     ═══════════════════════════════════════════════════════════════════════ */
  :root{
    --appBg:#f5f1e8; --sidebarBg:#0a2f1a; --sidebarBorder:rgba(201,168,76,.22); --sidebarSub:#9db3a3;
    --logoInk:#c9a84c; --navActiveBg:rgba(201,168,76,.13); --navActiveText:#f3ecdb; --navText:#b9c8be;
    --sectionLabel:#6f8b78;
    --cardBg:#fff; --cardBorder:#e7decd; --cardShadow:0 1px 2px rgba(10,47,26,.04); --softCardBg:#fbf7ee;
    --heading:#0a2f1a; --text:#374a3e; --textMuted:#5a6b61; --subtle:#5f7066;
    --trackBg:#f0ead9; --bar1:#0a2f1a; --bar2:#164e2b;
    --rowBorder:#eee6d6; --headBg:#f6f1e6; --chipBg:#f0ead9; --chipText:#6b5a2a;
    --inputBg:#fff; --inputBorder:#ddd2ba; --segBg:#eae3d4; --segBorder:#ddd2ba;
    --btnBg:#0a2f1a; --btnInk:#f3ecdb; --avatarBg:#0a2f1a; --avatarInk:#c9a84c;
    --pos:#2f7d4f; --neg:#c0392b; --accent:#c9a84c;
    --gridLine:#eee6d6;
    --highlightBg:#0a2f1a; --highlightLabel:#c9a84c; --highlightValue:#f3ecdb; --highlightMuted:#b9c8be;
    --okBg:#e7f4ec; --okInk:#2f7d4f; --soonBg:#fbf3df; --soonInk:#a5842f; --lateBg:#fbe6e2; --lateInk:#c0392b;
    --blueBg:#eff6ff; --blueInk:#1d4ed8; --orangeBg:#fff7ed; --orangeInk:#c2410c;
    --serif:'Cormorant Garamond',serif; --sans:'Instrument Sans',system-ui,sans-serif;
  }
  [data-tema="escuro"]{
    --appBg:#0d1512; --sidebarBg:#081210; --sidebarBorder:rgba(201,168,76,.18); --sidebarSub:#7d9789;
    --navActiveBg:rgba(201,168,76,.16); --navActiveText:#f2f7f3; --navText:#8ba392; --sectionLabel:#6f8b78;
    --cardBg:#12201b; --cardBorder:#1e332b; --cardShadow:0 1px 3px rgba(0,0,0,.35); --softCardBg:#152722;
    --heading:#f2f7f3; --text:#cfe0d6; --textMuted:#8ba392; --subtle:#7d9789;
    --trackBg:#1b2f28; --rowBorder:#1e332b; --headBg:#152722; --chipBg:rgba(201,168,76,.14); --chipText:#d9be6e;
    --inputBg:#0f1c18; --inputBorder:#264036; --segBg:#152722; --segBorder:#264036;
    --btnBg:#c9a84c; --btnInk:#0a2f1a;
    --gridLine:#1e332b;
    --okBg:rgba(47,125,79,.16); --okInk:#8fc9a2; --soonBg:rgba(201,168,76,.14); --soonInk:#d9be6e;
    --lateBg:rgba(192,57,43,.16); --lateInk:#e08a6a;
    --blueBg:rgba(125,175,255,.14); --blueInk:#9dc3ff; --orangeBg:rgba(251,146,60,.14); --orangeInk:#f3a866;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#1b1b1b;font-family:var(--sans)}

  /* ── Barra de revisão (NÃO faz parte da plataforma) ── */
  #chrome{position:fixed;inset:0 0 auto 0;z-index:100;background:#141414;color:#e8e8e8;
    border-bottom:1px solid #333;padding:9px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px}
  #chrome strong{font-family:var(--serif);font-size:17px;font-weight:600;color:#c9a84c}
  #chrome button{background:#222;color:#e8e8e8;border:1px solid #3a3a3a;border-radius:7px;padding:6px 11px;font-size:12px;font-family:inherit;cursor:pointer}
  #chrome button.on{background:#c9a84c;color:#20140a;border-color:#c9a84c;font-weight:700}
  #chrome .sep{width:1px;height:20px;background:#333}
  #chrome .hint{color:#888;font-size:11.5px}
  #stage{padding-top:48px}
  .shot{margin:0 0 34px}
  .shot-label{position:sticky;top:48px;z-index:20;background:#141414;color:#c9a84c;font-size:11px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border-top:1px solid #333}
  .viewport{margin:0 auto;transition:max-width .2s}
  body[data-vp="tablet"] .viewport{max-width:900px}
  body[data-vp="mobile"] .viewport{max-width:420px}

  /* ═══ Plataforma ═══ */
  .app{display:flex;min-height:520px;background:var(--appBg)}
  .side{width:238px;flex:none;background:var(--sidebarBg);display:flex;flex-direction:column;padding:22px 14px 16px;border-right:1px solid var(--sidebarBorder)}
  body[data-vp="mobile"] .side{display:none}
  .brandrow{display:flex;align-items:center;gap:11px;padding:0 6px 20px}
  .logo{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--logoInk);color:var(--logoInk);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;font-weight:600}
  .brandname{font-family:var(--serif);font-size:19px;font-weight:600;font-style:italic;color:#f3ecdb;line-height:1.05}
  .brandsub{font-size:8.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--sidebarSub);margin-top:3px}
  .seclabel{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;font-weight:600;color:var(--sectionLabel);padding:14px 10px 8px}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13.5px;color:var(--navText);margin-bottom:2px}
  .nav.on{background:var(--navActiveBg);color:var(--navActiveText);font-weight:600}
  .nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
  .sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--sidebarBorder);display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--avatarBg);color:var(--avatarInk);border:1px solid var(--sidebarBorder);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;font-weight:600}
  .toggle{display:flex;gap:3px;background:rgba(0,0,0,.25);border-radius:9px;padding:3px;margin-bottom:12px}
  .toggle span{flex:1;text-align:center;font-size:10.5px;padding:6px 4px;border-radius:7px;color:var(--navText)}
  .toggle span.on{background:var(--navActiveBg);color:var(--navActiveText);font-weight:700}

  .main{flex:1;min-width:0;padding:30px 34px 40px;color:var(--text)}
  body[data-vp="mobile"] .main{padding:20px 14px 30px}
  .eyebrow{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;font-weight:600;color:var(--accent);margin-bottom:7px}
  h1{margin:0;font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.5px;color:var(--heading)}
  body[data-vp="mobile"] h1{font-size:27px}
  .sub{font-size:12.5px;color:var(--textMuted);margin:8px 0 0;max-width:560px;line-height:1.5}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .card{background:var(--cardBg);border:1px solid var(--cardBorder);box-shadow:var(--cardShadow);border-radius:14px}
  .btn{padding:10px 20px;background:var(--btnBg);color:var(--btnInk);border:none;border-radius:10px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer}
  .btn.ghost{background:var(--cardBg);color:var(--heading);border:1px solid var(--cardBorder)}
  .grid{display:grid;gap:14px}
  .k{font-size:10.5px;font-weight:700;color:var(--textMuted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .v{font-family:var(--serif);font-size:27px;font-weight:600;color:var(--heading);line-height:1}
  .chip{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;background:var(--chipBg);color:var(--chipText)}
  .row{display:flex;gap:11px;align-items:center;padding:9px 0;border-top:1px solid var(--rowBorder);font-size:12.5px}
  .num{font-family:var(--serif);font-weight:700;text-align:right;white-space:nowrap}
  .inp{padding:8px 10px;border-radius:9px;border:1px solid var(--inputBorder);background:var(--inputBg);color:var(--heading);font-size:12.5px;font-family:inherit;width:100%}
  .pill{padding:7px 14px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid var(--cardBorder);color:var(--textMuted);background:transparent}
  .pill.on{border-color:var(--accent);background:var(--softCardBg);color:var(--accent)}
  .ok{background:var(--okBg);color:var(--okInk)} .soon{background:var(--soonBg);color:var(--soonInk)} .late{background:var(--lateBg);color:var(--lateInk)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10px;font-weight:800;color:var(--textMuted);text-transform:uppercase;letter-spacing:.6px;padding:11px 8px;background:var(--headBg)}
  td{padding:9px 8px;border-top:1px solid var(--rowBorder);color:var(--text)}
  .scroll{overflow-x:auto}
</style>
</head>
<body data-vp="desktop">

<div id="chrome">
  <strong>Lúcia Cílio</strong><span class="hint">revisão de design · 25/08/2026</span>
  <span class="sep"></span>
  <button id="bTema">🌙 Tema escuro</button>
  <span class="sep"></span>
  <button class="vp on" data-vp="desktop">Desktop</button>
  <button class="vp" data-vp="tablet">Tablet</button>
  <button class="vp" data-vp="mobile">Telemóvel</button>
  <span class="sep"></span>
  <span class="hint">10 ecrãs · barra preta não faz parte da plataforma</span>
</div>

<div id="stage"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// Peças reutilizadas (a plataforma real é React; aqui é o mesmo desenho em HTML)
// ═══════════════════════════════════════════════════════════════════════════
const I = {
  painel:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  caixa:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8 8h8M8 12h5"/>',
  cat:'<path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h8z"/>',
  obrig:'<rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 2.5v4M16 2.5v4"/>',
  preco:'<rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M8 7h8M8 11h8M8 15h4"/>',
  kpi:'<path d="M4 20V4M4 20h16"/><path d="M8 16l3-4 3 2 4-6"/>',
  cli:'<circle cx="9" cy="8" r="3.3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.6M17.5 20a5 5 0 0 0-3-4.6"/>',
  emp:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/>',
  rel:'<path d="M6 3.5h8l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M13.5 3.5V8H18M8.5 13h7M8.5 16.5h7"/>',
  esc:'<path d="M12 3 4 6v6c0 4.5 3.2 7.5 8 9 4.8-1.5 8-4.5 8-9V6z"/>',
  adm:'<circle cx="12" cy="8" r="3.2"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>',
  mkt:'<path d="M4 10v4h3l6 3.5v-11L7 10H4z"/><path d="M17 9.5a3.5 3.5 0 0 1 0 5"/>',
  mat:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/>',
}
const nav = (ic,txt,on)=>`<div class="nav ${on?'on':''}"><svg viewBox="0 0 24 24">${I[ic]}</svg>${txt}</div>`

const MENUS = {
  gestao:[['','Gestão',[['cli','Clientes ativos'],['kpi','Prospeção (CRM)'],['rel','Consultorias'],['mkt','Marketing'],['caixa','Financeiro'],['adm','Gestão de Acessos']]]],
  cont:[['','Contabilidade',[['painel','Painel'],['caixa','Livro de Caixa'],['esc','Conciliação'],['cat','Catálogo'],['obrig','Obrigações Fiscais']]],
        ['','Gestão',[['preco','Precificação'],['kpi','Planeamento'],['cli','Clientes'],['emp','Empresa'],['esc','Rücklagen'],['rel','Relatório EÜR']]]],
  esg:[['','ESG',[['mat','Dupla Materialidade'],['esc','Diagnóstico'],['kpi','Indicadores'],['cat','Projetos'],['rel','Relatórios']]]],
}
function side(plat, ativo){
  const secs = MENUS[plat].map(([_,titulo,itens])=>
    `<div class="seclabel">${titulo}</div>`+itens.map(([ic,t])=>nav(ic,t,t===ativo)).join('')).join('')
  return `<div class="side">
    <div class="brandrow"><div class="logo">LC</div><div><div class="brandname">Lúcia Cílio</div><div class="brandsub">Office Consulting</div></div></div>
    <div class="toggle">
      <span class="${plat==='gestao'?'on':''}">Gestão</span>
      <span class="${plat==='cont'?'on':''}">Contábil</span>
      <span class="${plat==='esg'?'on':''}">ESG</span>
    </div>
    ${secs}
    <div class="sidefoot"><div class="avatar">L</div><div><div style="font-size:12px;color:#f3ecdb">Lúcia Cílio</div><div style="font-size:10px;color:var(--sidebarSub)">Administradora</div></div></div>
  </div>`
}
const head=(eyebrow,titulo,sub,acao='')=>`<div class="head"><div>
  <div class="eyebrow">${eyebrow}</div><h1>${titulo}</h1>${sub?`<p class="sub">${sub}</p>`:''}
  </div><div style="display:flex;gap:8px">${acao}</div></div>`

// ═══════════════════════════════════════════════════════════════════════════
// Os ecrãs
// ═══════════════════════════════════════════════════════════════════════════
const ECRAS = []
const ecra = (label, plat, ativo, corpo) => ECRAS.push({label, html:`<div class="app">${side(plat,ativo)}<div class="main">${corpo}</div></div>`})

// 1 · Painel da Contabilidade
ecra('01 · Contabilidade — Painel','cont','Painel',
  head('Contabilidade','Painel','Agosto de 2026 · visão do mês','<button class="btn">+ Nova Entrada</button>')+
  `<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
    ${[['Entradas','12 050,00 €','var(--pos)'],['Saídas','4 200,00 €','var(--neg)'],['Resultado','7 850,00 €','var(--heading)']].map(([k,v,c])=>
      `<div class="card" style="padding:17px 19px"><div class="k">${k}</div><div class="v" style="color:${c}">${v}</div></div>`).join('')}
    <div class="card" style="padding:17px 19px;background:var(--highlightBg);border-color:var(--highlightBg)">
      <div class="k" style="color:var(--highlightLabel)">Reserva de impostos</div>
      <div class="v" style="color:var(--highlightValue)">1 962,50 €</div>
      <div style="font-size:11px;color:var(--highlightMuted);margin-top:5px">25% do resultado</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1.6fr 1fr">
    <div class="card" style="padding:18px 20px">
      <div class="k">Fluxo dos últimos 6 meses</div>
      <svg viewBox="0 0 520 170" style="width:100%;height:auto;margin-top:8px">
        ${[0,1,2,3].map(i=>`<line x1="0" y1="${20+i*40}" x2="520" y2="${20+i*40}" stroke="var(--gridLine)"/>`).join('')}
        <polyline points="20,120 105,95 190,105 275,70 360,58 445,35" fill="none" stroke="var(--bar2)" stroke-width="2.5"/>
        <polyline points="20,140 105,132 190,138 275,120 360,126 445,112" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
        ${['Mar','Abr','Mai','Jun','Jul','Ago'].map((m,i)=>`<text x="${20+i*85}" y="163" font-size="10" fill="var(--subtle)" text-anchor="middle" font-family="var(--sans)">${m}</text>`).join('')}
      </svg>
    </div>
    <div class="card" style="padding:18px 20px">
      <div class="k">Obrigações próximas</div>
      ${[['IVA · 3.º trimestre','20 Nov','soon'],['Segurança Social','20 Set','ok'],['IRS · retenção','20 Set','ok']].map(([t,d,c])=>
        `<div class="row"><span style="flex:1">${t}</span><span class="chip ${c}">${d}</span></div>`).join('')}
    </div>
  </div>`)

// 2 · Livro de Caixa
ecra('02 · Contabilidade — Livro de Caixa','cont','Livro de Caixa',
  head('Contabilidade','Livro de Caixa','Entradas e saídas do mês, com IVA e destino','<button class="btn ghost">Exportar CSV</button><button class="btn">+ Nova Entrada</button>')+
  `<div class="card scroll" style="overflow:hidden">
    <table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th style="text-align:right">Valor</th><th>IVA</th><th>Destino</th></tr>
    ${[['02/08','Consultoria ESG — GrünBau','Serviços','+ 2 500,00','19%','Banco','pos'],
       ['05/08','Material de escritório','Material','− 145,90','19%','Caixa','neg'],
       ['12/08','Formação IHK','Formação','− 380,00','—','Banco','neg'],
       ['18/08','Contabilidade mensal','Honorários','− 220,00','19%','Banco','neg'],
       ['28/08','Consultoria de implementação','Serviços','+ 50,00','19%','Caixa','pos']].map(([d,desc,cat,v,iva,dest,t])=>
      `<tr><td style="color:var(--subtle)">${d}</td><td style="font-weight:600;color:var(--heading)">${desc}</td>
       <td><span class="chip">${cat}</span></td><td class="num" style="color:var(--${t})">${v} €</td>
       <td style="font-size:11px;color:var(--subtle)">${iva}</td><td><span class="chip">${dest}</span></td></tr>`).join('')}
    <tr style="background:var(--softCardBg)"><td colspan="3" style="font-weight:800;color:var(--heading)">TOTAL</td>
      <td class="num" style="font-weight:800;color:var(--heading)">7 850,00 €</td><td colspan="2"></td></tr>
    </table></div>`)

// 3 · Conciliação (novo)
ecra('03 · Contabilidade — Conciliação caixa/banco  ★ novo','cont','Conciliação',
  head('Contabilidade','Conciliação caixa/banco','Importa o extrato bancário (CSV ou Excel) e cruza-o com o Livro de Caixa.')+
  `<div class="card" style="padding:18px 20px;margin-bottom:16px;display:flex;gap:12px;align-items:center">
    <button class="btn">📄 Escolher ficheiro</button><span style="font-size:11.5px;color:var(--subtle)">CSV · Excel</span></div>
  <div style="display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    <span class="pill on">Por conciliar (2)</span><span class="pill">Conciliados (12)</span><span class="pill">Ignorados (0)</span><span class="pill">Não constam do extrato (1)</span>
    <button class="btn" style="margin-left:auto;padding:8px 15px;font-size:12px">⚡ Conciliar 1</button></div>
  ${[['05/01','TRF P/ FORNECEDOR ABC LDA','− 450,00','neg',true,'05/01 · Fornecedor ABC Lda · 450,00',95,false],
     ['15/01','COMISSAO MANUTENCAO','− 6,50','neg',false,'',0,false],
     ['08/01','DEPOSITO NUMERARIO','+ 1 200,00','pos',true,'09/01 · Depósito em numerário · 1 200,00',90,true]].map(([d,desc,v,t,tem,sug,score,amb])=>
    `<div class="card" style="padding:14px 17px;margin-bottom:9px">
      <div style="display:flex;gap:11px;align-items:center;flex-wrap:wrap">
        <span style="width:60px;font-size:11.5px;color:var(--subtle);font-family:var(--serif)">${d}</span>
        <span style="flex:1;min-width:150px;font-size:13px;font-weight:600;color:var(--heading)">${desc}</span>
        <span class="num" style="font-size:14px;color:var(--${t})">${v} €</span></div>
      <div style="margin-top:9px;padding-top:9px;border-top:1px solid var(--rowBorder)">
        ${tem?`<div style="background:${amb?'var(--soonBg)':'var(--softCardBg)'};border-radius:9px;padding:9px 11px;margin-bottom:8px">
          <div style="font-size:10px;font-weight:800;color:${amb?'var(--soonInk)':'var(--textMuted)'};text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Sugestão · ${score}% confiança ${score>=85?'⚡':''}</div>
          <div style="font-size:12.5px">${sug}</div>
          ${amb?'<div style="font-size:11px;color:var(--soonInk);margin-top:4px;font-weight:600">⚠ Há vários lançamentos iguais — confirma qual</div>':''}</div>`:''}
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          ${tem?'<button class="btn" style="padding:6px 12px;font-size:11.5px">Conciliar</button>':''}
          <button class="btn ghost" style="padding:6px 12px;font-size:11.5px">Criar lançamento</button>
          <button class="btn ghost" style="padding:6px 12px;font-size:11.5px;border:none;background:none;color:var(--subtle)">Ignorar</button></div>

const bTema = document.getElementById('bTema')
bTema.onclick = () => {
  const escuro = document.documentElement.getAttribute('data-tema') === 'escuro'

  bTema.classList.toggle('on', !escuro)
}
document.querySelectorAll('.vp').forEach(b => b.onclick = () => {
