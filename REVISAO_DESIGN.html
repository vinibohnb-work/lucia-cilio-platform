<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lúcia Cílio — Revisão de Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Instrument+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#1b1b1b;font-family:'Instrument Sans',system-ui,sans-serif}

  /* ── Barra de revisão (não faz parte da plataforma) ── */
  #chrome{position:fixed;inset:0 0 auto 0;z-index:100;background:#141414;color:#e8e8e8;
    border-bottom:1px solid #333;padding:9px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px}
  #chrome strong{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:#c9a84c;letter-spacing:.3px}
  #chrome select,#chrome button{background:#222;color:#e8e8e8;border:1px solid #3a3a3a;border-radius:7px;
    padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer}
  #chrome button.on{background:#c9a84c;color:#20140a;border-color:#c9a84c;font-weight:700}
  #chrome .sep{width:1px;height:20px;background:#333}
  #chrome .hint{color:#888;font-size:11.5px}
  #stage{padding-top:46px}

  /* Modo "todos": cada ecrã numa moldura com legenda */
  .shot{margin:0 0 30px}
  .shot-label{position:sticky;top:46px;z-index:20;background:#141414;color:#c9a84c;font-size:11px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;padding:7px 16px;border-top:1px solid #333}
  .frame{border:0}

  /* ── Plataforma ── */
  .app{display:flex;min-height:calc(100vh - 46px)}
  .side{width:238px;flex:none;display:flex;flex-direction:column;padding:22px 14px 16px}
  .brandrow{display:flex;align-items:center;gap:11px;padding:0 6px 20px}
  .logo{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600}
  .brandname{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;line-height:1.05;font-style:italic}
  .brandsub{font-size:8.5px;letter-spacing:2.6px;text-transform:uppercase;margin-top:3px}
  .seclabel{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;font-weight:600;padding:0 10px 8px}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13.5px;margin-bottom:2px}
  .nav.act{font-weight:600}
  .nav .bdg{margin-left:auto;font-size:10px;font-weight:700;border-radius:20px;padding:1px 7px}
  .main{flex:1;min-width:0;padding:30px 34px 44px}

  /* utilitários dos mockups */
  .h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.5px;margin:0}
  .eyebrow{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;font-weight:600;margin-bottom:7px}
  .sub{font-size:12.5px;margin:8px 0 0;line-height:1.5}
  .card{border-radius:14px;padding:18px 20px}
  .grid{display:grid;gap:14px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .kpi-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .kpi-v{font-size:26px;font-weight:800;letter-spacing:-.5px;font-family:'Cormorant Garamond',serif}
  .chip{padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;display:inline-block}
  .btn{padding:10px 20px;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:9px 10px}
  td{padding:9px 10px;font-size:12.5px}
  input,select,textarea{font-family:inherit}
  .inp{padding:9px 11px;border-radius:9px;font-size:13px;width:100%}
  .note{display:flex;gap:9px;align-items:flex-start;padding:11px 14px;border-radius:11px;font-size:11.5px;line-height:1.5;margin-bottom:18px}
</style>
</head>
<body>

<div id="chrome">
  <strong>Lúcia Cílio</strong>
  <span class="hint">revisão de design</span>
  <span class="sep"></span>
  <select id="pick"></select>
  <span class="sep"></span>
  <button id="prev">←</button><button id="next">→</button>
  <span class="sep"></span>
  <button id="tLight" class="on">Claro</button>
  <button id="tNight">Noturno</button>
  <span class="sep"></span>
  <button id="all">Ver todos</button>
  <span class="hint" id="count"></span>
</div>

<div id="stage"></div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// Tokens copiados de src/theme.js — o mockup usa exatamente as mesmas cores,
// fontes e sombras da plataforma. Se o tema mudar lá, tem de mudar aqui.
// ════════════════════════════════════════════════════════════════════════════
const THEMES = {
  light: {
    appBg:'#f5f1e8', mainBg:'#f5f1e8',
    sidebarBg:'#0a2f1a', sidebarBorder:'rgba(201,168,76,.22)', sidebarSub:'#9db3a3',
    logoBg:'transparent', logoInk:'#c9a84c', logoBorder:'1.5px solid #c9a84c',
    navActiveBg:'rgba(201,168,76,.13)', navActiveText:'#f3ecdb', navText:'#b9c8be',
    sectionLabel:'#6f8b78',
    cardBg:'#fff', cardBorder:'#e7decd', cardShadow:'0 1px 2px rgba(10,47,26,.04)',
    softCardBg:'#fbf7ee',
    heading:'#0a2f1a', text:'#374a3e', textMuted:'#5a6b61', subtle:'#5f7066',
    trackBg:'#f0ead9', rowBorder:'#eee6d6', headBg:'#f6f1e6',
    chipBg:'#f0ead9', chipText:'#6b5a2a',
    inputBg:'#fff', inputBorder:'#ddd2ba', segBg:'#eae3d4', segBorder:'#ddd2ba',
    badgeBg:'#fbe6e2', badgeInk:'#c0392b',
    btnBg:'#0a2f1a', btnInk:'#f3ecdb',
    avatarBg:'#0a2f1a', avatarInk:'#c9a84c',
    pos:'#2f7d4f', neg:'#c0392b', accent:'#c9a84c',
    gridLine:'#eee6d6',
    loginBg:'#f5f1e8', loginShadow:'0 30px 70px -30px rgba(10,47,26,.35)',
    fontBody:"'Instrument Sans',system-ui,sans-serif", fontDisplay:"'Cormorant Garamond',serif", fontNum:"'Cormorant Garamond',serif",
    dueOk:{bg:'#e7f4ec',ink:'#2f7d4f'}, dueSoon:{bg:'#fbf3df',ink:'#a5842f'}, dueLate:{bg:'#fbe6e2',ink:'#c0392b'},
  },
  night: {
    appBg:'#071c11', mainBg:'radial-gradient(120% 100% at 100% 0%,#0d2c1a 0%,#071c11 55%)',
    sidebarBg:'#04140b', sidebarBorder:'rgba(201,168,76,.22)', sidebarSub:'#8ba392',
    logoBg:'linear-gradient(140deg,#c9a84c,#a5842f)', logoInk:'#071c11', logoBorder:'none',
    navActiveBg:'rgba(201,168,76,.16)', navActiveText:'#f3ecdb', navText:'#8ba392',
    sectionLabel:'#5f7c6b',
    cardBg:'rgba(255,255,255,.045)', cardBorder:'rgba(201,168,76,.14)', cardShadow:'none',
    softCardBg:'rgba(255,255,255,.04)',
    heading:'#f2f7f3', text:'#cfe0d6', textMuted:'#8ba392', subtle:'#7d9789',
    trackBg:'rgba(255,255,255,.07)', rowBorder:'rgba(255,255,255,.07)', headBg:'rgba(255,255,255,.03)',
    chipBg:'rgba(201,168,76,.14)', chipText:'#d8bd74',
    inputBg:'rgba(255,255,255,.05)', inputBorder:'rgba(201,168,76,.22)',
    segBg:'rgba(255,255,255,.05)', segBorder:'rgba(201,168,76,.22)',
    badgeBg:'rgba(201,168,76,.2)', badgeInk:'#d8bd74',
    btnBg:'linear-gradient(140deg,#c9a84c,#a5842f)', btnInk:'#20140a',
    avatarBg:'linear-gradient(140deg,#164e2b,#0a2f1a)', avatarInk:'#c9a84c',
    pos:'#7fd6a0', neg:'#e08b7a', accent:'#c9a84c',
    gridLine:'rgba(255,255,255,.06)',
    loginBg:'radial-gradient(120% 90% at 50% 0%,#0d2c1a 0%,#071c11 60%)', loginShadow:'0 30px 80px -30px rgba(0,0,0,.6)',
    fontBody:"'Manrope',system-ui,sans-serif", fontDisplay:"'Cormorant Garamond',serif", fontNum:"'Space Grotesk',monospace",
    dueOk:{bg:'rgba(127,214,160,.14)',ink:'#7fd6a0'}, dueSoon:{bg:'rgba(201,168,76,.18)',ink:'#d8bd74'}, dueLate:{bg:'rgba(224,86,66,.16)',ink:'#e08b7a'},
  },
}
let T = THEMES.light

// ── Ícones do menu (os mesmos traços da plataforma) ──
const ic = (inner) => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="flex:none">${inner}</svg>`
const I = {
  painel: ic('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
  caixa: ic('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8 8h8M8 12h5"/>'),
  catalogo: ic('<path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h8z"/><circle cx="7.5" cy="7.5" r="1.4" fill="currentColor" stroke="none"/>'),
  obrig: ic('<rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 2.5v4M16 2.5v4"/>'),
  preco: ic('<rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M8 7h8M8 11h8M8 15h4"/>'),
  kpi: ic('<path d="M4 20V4M4 20h16"/><path d="M8 16l3-4 3 2 4-6" stroke-width="1.6"/>'),
  clientes: ic('<circle cx="9" cy="8" r="3.3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.6M17.5 20a5 5 0 0 0-3-4.6"/>'),
  empresa: ic('<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/>'),
  rel: ic('<path d="M6 3.5h8l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M13.5 3.5V8H18M8.5 13h7M8.5 16.5h7" stroke-width="1.4"/>'),
  ruck: ic('<path d="M12 3 4 6v6c0 4.5 3.2 7.5 8 9 4.8-1.5 8-4.5 8-9V6z"/><path d="M9.3 12h5.4M12 9.3v5.4" stroke-width="1.5"/>'),
  material: ic('<rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/>'),
  diag: ic('<path d="M12 21c4-2.5 6-6 6-11a6 6 0 0 0-12 0c0 5 2 8.5 6 11z"/><path d="M12 3c0 6 0 12 0 16" stroke-width="1.4"/>'),
  proj: ic('<path d="M3.5 7.5a2 2 0 0 1 2-2H10l2 2.2h6.5a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>'),
  admin: ic('<circle cx="12" cy="8" r="3.2"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>'),
  mkt: ic('<path d="M4 10v4h3l6 3.5v-11L7 10H4z"/><path d="M17 9.5a3.5 3.5 0 0 1 0 5" stroke-width="1.6"/>'),
}

// ── Menus por plataforma ──
const NAV = {
  contabil: [
    ['Contabilidade', [['Painel','painel'],['Livro de Caixa','caixa'],['Catálogo','catalogo'],['Obrigações Fiscais','obrig',6]]],
    ['Gestão', [['Calculadora de Preços','preco'],['Planeamento Mensal','kpi'],['Clientes','clientes'],['Empresa','empresa'],['Consultoria','rel'],['Reservas & Impostos','ruck']]],
  ],
  lite: [
    ['Contabilidade', [['Painel','painel'],['Livro de Caixa','caixa'],['Catálogo','catalogo'],['Obrigações Fiscais','obrig',6]]],
  ],
  esg: [
    ['ESG', [['Materialidade','material'],['Diagnóstico ESG','diag'],['KPIs & Monitorização','kpi'],['Projetos','proj'],['Relatórios','rel'],['Consultoria','caixa']]],
  ],
  gestao: [
    ['Gestão', [['Clientes Ativos','clientes'],['Prospeção (CRM)','kpi'],['Marketing','mkt'],['Financeiro','caixa'],['Gestão de Acessos','admin']]],
  ],
}

// ── Blocos reutilizáveis ──
const card = (inner, extra='') => `<div class="card" style="background:${T.cardBg};border:1px solid ${T.cardBorder};box-shadow:${T.cardShadow};${extra}">${inner}</div>`
const head = (eyebrow, title, sub, right='') => `
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px">
    <div>
      <div class="eyebrow" style="color:${T.accent}">${eyebrow}</div>
      <h1 class="h1" style="color:${T.heading}">${title}</h1>
      ${sub?`<p class="sub" style="color:${T.textMuted};max-width:560px">${sub}</p>`:''}
    </div>
    <div class="row">${right}</div>
  </div>`
const btn = (txt) => `<button class="btn" style="background:${T.btnBg};color:${T.btnInk}">${txt}</button>`
const chip = (txt,bg,ink) => `<span class="chip" style="background:${bg};color:${ink}">${txt}</span>`
const kpi = (l,v,s,c) => card(`<div class="kpi-l" style="color:${T.textMuted}">${l}</div>
  <div class="kpi-v" style="color:${c||T.heading};margin:4px 0">${v}</div>
  ${s?`<div style="font-size:11.5px;color:${T.subtle}">${s}</div>`:''}`)
const estimate = () => `<div class="note" style="background:${T.softCardBg};border:1px solid ${T.cardBorder};color:${T.textMuted}">
  <span>ⓘ</span><span>Valores estimados a partir dos lançamentos introduzidos. Não os considere definitivos — confirme sempre os montantes finais com a autoridade tributária ou com o seu contabilista certificado.</span></div>`
const table = (cols, rows) => card(`<div style="overflow-x:auto"><table>
  <thead><tr style="background:${T.headBg}">${cols.map(c=>`<th style="color:${T.textMuted}">${c}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr style="border-top:1px solid ${T.rowBorder}">${r.map(c=>`<td style="color:${T.text}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
</table></div>`,'padding:0;overflow:hidden')
const inp = (v,w='100%') => `<input class="inp" value="${v}" style="background:${T.inputBg};border:1px solid ${T.inputBorder};color:${T.heading};width:${w}" readonly>`
const field = (l,v,w) => `<div style="flex:1;min-width:150px"><div style="font-size:11px;font-weight:600;color:${T.textMuted};margin-bottom:6px">${l}</div>${inp(v,w)}</div>`

// ── Ecrãs ───────────────────────────────────────────────────────────────────
const S = {}

S.login = () => `<div style="min-height:calc(100vh - 46px);display:flex;align-items:center;justify-content:center;background:${T.loginBg};padding:40px">
  <div style="width:400px;max-width:100%;border-radius:20px;padding:40px 38px;background:${T.cardBg};border:1px solid ${T.cardBorder};box-shadow:${T.loginShadow}">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px">
      <div class="logo" style="width:68px;height:68px;font-size:30px;border:${T.logoBorder};background:${T.logoBg};color:${T.logoInk};margin-bottom:14px">C</div>
      <div style="font-family:${T.fontDisplay};font-size:26px;font-weight:600;font-style:italic;color:${T.heading}">Lúcia Cílio</div>
      <div style="font-size:9px;letter-spacing:3px;text-transform:uppercase;color:${T.accent};margin-top:4px">Office Consulting</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:15px">
      <div><div style="font-size:11px;font-weight:600;color:${T.textMuted};margin-bottom:7px">E-MAIL</div>${inp('lucia@exemplo.com')}</div>
      <div><div style="font-size:11px;font-weight:600;color:${T.textMuted};margin-bottom:7px">PALAVRA-PASSE</div>${inp('••••••••')}</div>
      <button class="btn" style="background:${T.btnBg};color:${T.btnInk};width:100%;padding:13px;margin-top:8px">Entrar</button>
    </div>
  </div></div>`

S.senha = () => `<div style="min-height:calc(100vh - 46px);display:flex;align-items:center;justify-content:center;background:${T.loginBg};padding:40px">
  <div style="width:400px;max-width:100%;border-radius:20px;padding:40px 38px;background:${T.cardBg};border:1px solid ${T.cardBorder};box-shadow:${T.loginShadow}">
    <div style="text-align:center;margin-bottom:24px">
      <div class="logo" style="width:68px;height:68px;font-size:30px;border:${T.logoBorder};background:${T.logoBg};color:${T.logoInk};margin:0 auto 14px">C</div>
      <div style="font-family:${T.fontDisplay};font-size:24px;font-weight:600;color:${T.heading}">Definir nova palavra-passe</div>
      <p style="font-size:13px;color:${T.textMuted};margin:6px 0 0;line-height:1.5">Recebeu uma palavra-passe temporária. Por segurança, defina a sua antes de continuar.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:15px">
      <div><div style="font-size:11px;font-weight:600;color:${T.textMuted};margin-bottom:7px">NOVA PALAVRA-PASSE</div>${inp('••••••••••')}</div>
      <div style="background:${T.softCardBg};border-radius:10px;padding:11px 13px">
        <div style="font-size:10.5px;font-weight:700;color:${T.textMuted};text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px">A palavra-passe deve conter:</div>
        ${[['Pelo menos 8 caracteres',1],['Uma letra minúscula',1],['Uma letra maiúscula',1],['Um número',0],['Um caractere especial (! @ # $ % &amp; *)',0]]
          .map(([r,ok])=>`<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:${ok?T.pos:T.subtle};margin-bottom:4px">
            <span style="width:13px;text-align:center;font-weight:800">${ok?'✓':'○'}</span><span>${r}</span></div>`).join('')}
      </div>
      <div><div style="font-size:11px;font-weight:600;color:${T.textMuted};margin-bottom:7px">CONFIRMAR</div>${inp('••••••••••')}</div>
      <button class="btn" style="background:${T.btnBg};color:${T.btnInk};width:100%;padding:13px">Definir e continuar</button>
    </div>
  </div></div>`

S.painel = () => `
  <div class="row" style="margin-bottom:16px">
    <div style="display:flex;gap:4px;background:${T.cardBg};border-radius:10px;padding:4px;border:1px solid ${T.cardBorder}">
      <button class="btn" style="background:${T.accent};color:#fff;padding:6px 12px;font-size:12px">Anual</button>
      <button class="btn" style="background:transparent;color:${T.textMuted};padding:6px 12px;font-size:12px;border:1px solid ${T.cardBorder}">Trimestral</button>
    </div>
    <span style="margin-left:auto;font-size:12px;font-weight:700;color:${T.accent}">2026</span>
  </div>
  ${estimate()}
  <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
    ${kpi('Receita','€ 139.409','ano corrente',T.pos)}
    ${kpi('Despesas','€ 119.137','ano corrente',T.neg)}
    ${kpi('Saldo','€ 20.273','caixa + banco')}
    ${kpi('Margem de contribuição','58,4%','ponto de equilíbrio € 84.200',T.accent)}
  </div>
  <div class="grid" style="grid-template-columns:1.6fr 1fr;margin-bottom:16px">
    ${card(`<div class="kpi-l" style="color:${T.textMuted};margin-bottom:14px">Fluxo mensal</div>
      <svg viewBox="0 0 520 170" style="width:100%">
        ${[0,1,2,3].map(i=>`<line x1="0" y1="${20+i*40}" x2="520" y2="${20+i*40}" stroke="${T.gridLine}"/>`).join('')}
        <polyline fill="none" stroke="${T.accent}" stroke-width="2.5" points="20,120 100,96 180,104 260,70 340,84 420,52 500,66"/>
        <polyline fill="none" stroke="${T.pos}" stroke-width="2.5" stroke-dasharray="5 4" points="20,140 100,132 180,136 260,120 340,128 420,112 500,120"/>
      </svg>
      <div class="row" style="margin-top:10px;font-size:11.5px;color:${T.textMuted}">
        <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:3px;background:${T.accent};display:inline-block"></span>Entradas</span>
        <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:3px;background:${T.pos};display:inline-block"></span>Saídas</span>
      </div>`)}
    ${card(`<div class="kpi-l" style="color:${T.textMuted};margin-bottom:12px">IVA</div>

// ── Casca (menu lateral + conteúdo) ─────────────────────────────────────────
function sidebar(navKey, act) {
  let i = -1
  const secs = NAV[navKey].map(([label, items]) => `
    <div style="margin-bottom:20px">
      <div class="seclabel" style="color:${T.sectionLabel}">${label}</div>
      ${items.map(([n, icon, badge]) => { i++
        const on = i === act
        return `<div class="nav ${on?'act':''}" style="background:${on?T.navActiveBg:'transparent'};color:${on?T.navActiveText:T.navText}">
          ${I[icon]}<span>${n}</span>${badge?`<span class="bdg" style="background:${T.badgeBg};color:${T.badgeInk}">${badge}</span>`:''}
          ${on?`<span style="position:absolute;left:0;width:3px;height:20px;background:${T.accent};border-radius:0 3px 3px 0"></span>`:''}
        </div>`}).join('')}
    </div>`).join('')
  const toggle = navKey==='gestao' ? `<div style="display:flex;gap:4px;padding:2px;margin-bottom:14px;border-radius:9px;border:1px solid ${T.sidebarBorder}">
      ${[['Gestão',1],['Contábil',0],['ESG',0]].map(([l,on])=>`<div style="flex:1;padding:7px 4px;border-radius:7px;font-size:11px;font-weight:700;text-align:center;background:${on?T.accent:'transparent'};color:${on?'#0a2f1a':T.sidebarSub}">${l}</div>`).join('')}
    </div>` : ''
  return `<div class="side" style="background:${T.sidebarBg};border-right:1px solid ${T.sidebarBorder}">
    <div class="brandrow">
      <div class="logo" style="background:${T.logoBg};color:${T.logoInk};border:${T.logoBorder}">C</div>
      <div><div class="brandname" style="color:#f3ecdb">Lúcia Cílio</div>
        <div class="brandsub" style="color:${T.accent}">Office Consulting</div></div>
    </div>
    <div style="flex:1">${secs}</div>
    <div style="border-top:1px solid ${T.sidebarBorder};padding-top:14px">
      <div class="row" style="gap:9px;margin-bottom:14px">
        <span style="width:28px;height:28px;border-radius:50%;background:${T.avatarBg};color:${T.avatarInk};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:${T.fontDisplay}">VI</span>
        <span style="font-size:12.5px;color:${T.navText};flex:1">Vinícius Bohn</span>
        <span style="width:30px;height:30px;border-radius:8px;border:1px solid ${T.sidebarBorder};color:${T.sidebarSub};display:flex;align-items:center;justify-content:center">${I.painel?'⇥':''}</span>
      </div>
      ${toggle}
      <div class="row" style="justify-content:space-between">
        <div style="display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid ${T.sidebarBorder}">
          ${['🇵🇹','🇩🇪','🇬🇧'].map((f,fi)=>`<span style="padding:6px 9px;font-size:13px;background:${fi===0?T.accent:'transparent'};opacity:${fi===0?1:.5}">${f}</span>`).join('')}
        </div>
        <span style="width:32px;height:32px;border-radius:8px;background:${T.toggleBg||'transparent'};border:1px solid ${T.sidebarBorder};display:flex;align-items:center;justify-content:center;color:${T.accent}">☾</span>
      </div>
    </div>
  </div>`
}

const render = (sc) => sc.bare
  ? `<div style="background:${T.appBg};font-family:${T.fontBody}">${sc.r()}</div>`
  : `<div class="app" style="background:${T.appBg};font-family:${T.fontBody}">
       ${sidebar(sc.nav, sc.act)}
       <div class="main" style="background:${T.mainBg};color:${T.text}">${sc.r()}</div>
     </div>`

// ── Controlo da revisão ─────────────────────────────────────────────────────
let cur = 0, allMode = false
const stage = document.getElementById('stage')
const pick = document.getElementById('pick')

let last = ''
SCREENS.forEach((s, i) => {
  if (s.g !== last) { const og = document.createElement('optgroup'); og.label = s.g; og.id = 'g'+i; pick.appendChild(og); last = s.g }
  const o = document.createElement('option'); o.value = i; o.textContent = s.n
  pick.lastChild.appendChild(o)
})
document.getElementById('count').textContent = SCREENS.length + ' ecrãs'

function draw() {
  if (allMode) {
    stage.innerHTML = SCREENS.map(s => `<div class="shot"><div class="shot-label">${s.g} · ${s.n}</div>${render(s)}</div>`).join('')
  } else {
    stage.innerHTML = render(SCREENS[cur])
    pick.value = cur
  }
  document.body.style.background = T.appBg
}
function setTheme(k) {
  T = THEMES[k]
  document.getElementById('tLight').className = k === 'light' ? 'on' : ''
  document.getElementById('tNight').className = k === 'night' ? 'on' : ''
  draw()
}
pick.onchange = e => { allMode = false; document.getElementById('all').className = ''; cur = +e.target.value; draw() }
document.getElementById('prev').onclick = () => { allMode = false; document.getElementById('all').className=''; cur = (cur - 1 + SCREENS.length) % SCREENS.length; draw() }
document.getElementById('next').onclick = () => { allMode = false; document.getElementById('all').className=''; cur = (cur + 1) % SCREENS.length; draw() }
document.getElementById('tLight').onclick = () => setTheme('light')
document.getElementById('tNight').onclick = () => setTheme('night')
document.getElementById('all').onclick = e => { allMode = !allMode; e.target.className = allMode ? 'on' : ''; draw() }
document.onkeydown = e => { if (e.key === 'ArrowRight') document.getElementById('next').click(); if (e.key === 'ArrowLeft') document.getElementById('prev').click() }
draw()
</script>
